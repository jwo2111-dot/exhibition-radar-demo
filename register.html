<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add your exhibition · Exhibition Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <!-- A saved palette before the first paint, so arriving here from a
       dark index isn't a white flash. This page carries the default and
       dark only; Klein is the app's own. -->
  <script>
    (function () {
      try {
        var saved = (window.matchMedia("(max-width: 760px)").matches && !/ExhibitionRadarApp/.test(navigator.userAgent) && sessionStorage.getItem("er_app_preview") !== "1")
          ? sessionStorage.getItem("er_theme") : localStorage.getItem("er_theme"); // the phone website: this visit's palette only (see index.html)
        if (saved === "dark" || saved === "night") {     // "night" was the old name
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) { /* private mode: the page just starts light */ }
    })();
  </script>
  <style>
    /* The site's own hand, same as the masthead and the modal headings.
       A caps-only face, so it wants a little more room than the serif. */
    @font-face {
      font-family: 'Exhibition Radar Hand'; font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/ExhibitionRadarHand-Regular.ttf") format("truetype");
    }
    html { touch-action: manipulation; }
    /* Same plain system as index.html: white ground, Times headings,
       Arial controls, hairline fields, text buttons, no radius or shadow. */
    :root { --ink: #111111; --ink-sub: #555555; --ink-meta: #767676; --rule: #d8d8d8; --link: #0000ff; --reception: #007f28; --ground: #ffffff; --field: #ffffff; }
    /* Default and dark only -- Klein is the app's own palette, and a
       visitor on it fills the form on the white ground. */
    :root[data-theme="dark"] {
      --ink: #ece9e2; --ink-sub: #cdc9c0; --ink-meta: #aeaaa1;
      --rule: rgba(255, 255, 255, 0.24); --link: #a8c7ff; --reception: #93d48c;
      --ground: #151515; --field: #1d1d1d;
    }
    [hidden] { display: none !important; }
    body { font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; padding: 40px 24px 60px; color: var(--ink); background: var(--ground); }
    a { color: var(--link); }
    a:hover { color: #551a8b; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    a.back { font-size: 12px; color: var(--ink); text-decoration: none; }
    a.back:hover { text-decoration: underline; color: var(--ink); }
    h1 { font-family: 'Exhibition Radar Hand', 'Times New Roman', Times, serif; letter-spacing: 0.01em; font-weight: 400; font-size: 26px; line-height: 1.2; letter-spacing: -0.005em; margin: 22px 0 8px; }
    p.tagline { font-size: 12px; line-height: 1.75; color: var(--ink-sub); margin: 0; }
    form { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--ink-meta); text-transform: lowercase; }
    label .req { color: var(--ink); }
    input, textarea { background: var(--field); border: 1px solid var(--rule); border-radius: 0; padding: 8px 10px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: var(--ink); text-transform: none; }
    textarea { resize: vertical; min-height: 60px; }
    .row { display: flex; gap: 12px; }
    /* side-by-side field pairs get too cramped on phones -- stack them */
    @media (max-width: 480px) {
      .row { flex-direction: column; gap: 14px; }
      input, textarea { font-size: 16px; } /* stops iOS zooming on focus */
    }
    .row label { flex: 1; }
    .honeypot { position: absolute; left: -9999px; }
    button { align-self: flex-start; background: none; border: none; padding: 0; margin-top: 4px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: var(--ink); cursor: pointer; }
    button:hover { text-decoration: underline; }
    button:disabled { color: var(--ink-meta); cursor: default; text-decoration: none; }
    #status { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; min-height: 16px; }
    #status.success { color: var(--reception); }
    .hint { font-size: 11px; color: var(--ink-meta); text-transform: none; }
  </style>
</head>
<body>
  <a class="back" id="back-link" href="/">&larr; back to the radar</a>
  <h1>Add your exhibition</h1>

  <div id="login-gate" hidden>
    <p class="tagline">
      Exhibition Radar is in private preview. <a href="/">Log in on the radar</a> to
      submit an exhibition.
    </p>
  </div>

  <div id="form-wrap">
  <p class="tagline">
    Tell us about a current or upcoming exhibition. Every submission is reviewed by hand before
    it appears on the radar. Nothing is published automatically.
  </p>

  <form id="submission-form">
    <label>Venue / gallery name <span class="req">*</span>
      <input name="venue_name" required>
    </label>

    <div class="row">
      <label>City
        <input name="city">
      </label>
      <label>Country
        <input name="country">
      </label>
    </div>

    <label>Venue website
      <input name="venue_website" type="url" placeholder="https://">
    </label>

    <label>Show title <span class="req">*</span>
      <input name="title" required>
    </label>

    <label>Artist(s)
      <input name="artist_names" placeholder="Comma-separated, e.g. Agnes Rowe, Tomás Reyes">
    </label>

    <div class="row">
      <label>Start date <span class="req">*</span>
        <input name="start_date" type="date" required>
      </label>
      <label>End date <span class="req">*</span>
        <input name="end_date" type="date" required>
      </label>
    </div>

    <div class="row">
      <label>Opening reception date
        <input name="reception_date" type="date">
      </label>
      <label>Reception details
        <input name="reception_text" placeholder="e.g. Thursday, 6–8 PM">
      </label>
    </div>

    <label>Show page URL <span class="req">*</span>
      <input name="source_url" type="url" required placeholder="https://">
      <span class="hint">The page on the venue's own site where visitors can read more.</span>
    </label>

    <label>Image URL
      <input name="image_url" type="url" placeholder="https://">
    </label>

    <label>Your email
      <input name="submitter_email" type="email" placeholder="In case we have a question">
    </label>

    <label class="honeypot" aria-hidden="true">
      Leave this field blank
      <input name="website" tabindex="-1" autocomplete="off">
    </label>

    <button type="submit" id="submit-btn">Submit for review</button>
    <div id="status" role="status"></div>
  </form>
  </div>

  <script src="analytics.js" data-page="register"></script>
  <script>
    // Same-origin in production (render.yaml proxies /api/*), matching index.html.
    const API_BASE = "https://exhibitionradar.com";

    const form = document.getElementById("submission-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.className = "";
      statusEl.textContent = "Submitting…";

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch(`${API_BASE}/api/submissions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || "Something went wrong.");
        }
        if (window.erTrack) window.erTrack("submission_sent", { target: data.city || "", props: { venue: data.venue_name || "" } });
        statusEl.className = "success";
        statusEl.textContent = "✓ THANKS. IT'S IN THE QUEUE FOR REVIEW.";
        form.reset();
      } catch (err) {
        statusEl.textContent = err.message || "Couldn't reach the server. Please try again.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
